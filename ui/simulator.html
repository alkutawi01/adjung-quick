<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <title>Adjung Quick — Device Simulator</title>
    <style>
      /* Dev/testing tool only — NOT part of production Quick. Does not
         touch state/reducer/engine/Supabase adapter or any product
         behaviour. Runs the real live app (index.html) inside an iframe,
         framed to look like a phone, so mobile composition can be
         evaluated as an actual touch/visual experience rather than a
         resized browser window. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 24px;
        background: #2b2b2b;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      h1 { font-size: 1rem; font-weight: 500; margin: 0; color: #bbb; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .controls button {
        background: #3a3a3a;
        border: 1px solid #555;
        color: #eee;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .controls button.active { background: #7a3b2e; border-color: #7a3b2e; }
      .controls button:hover:not(.active) { background: #4a4a4a; }

      /* Phone bezel */
      .phone {
        background: #111;
        border-radius: 44px;
        padding: 14px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        position: relative;
      }
      .phone__notch {
        position: absolute;
        top: 14px; left: 50%;
        transform: translateX(-50%);
        width: 120px; height: 24px;
        background: #111;
        border-radius: 0 0 16px 16px;
        z-index: 2;
      }
      .phone__statusbar {
        position: absolute;
        top: 14px; left: 14px; right: 14px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        font-size: 0.7rem;
        color: #fff;
        z-index: 1;
        pointer-events: none;
      }
      .phone__screen {
        background: #fff;
        border-radius: 30px;
        overflow: hidden;
        position: relative;
      }
      .phone__screen iframe {
        display: block;
        border: none;
        width: 100%;
        height: 100%;
      }

      .device-label { font-size: 0.75rem; color: #999; text-align: center; }
    </style>
  </head>
  <body>
    <h1>Adjung Quick — Mobile Device Simulator (dev/testing sahaja, bukan production)</h1>
    <div class="controls" id="controls"></div>
    <div class="phone" id="phone">
      <div class="phone__notch"></div>
      <div class="phone__statusbar">
        <span id="clock">9:41</span>
        <span>●●●● 5G 🔋</span>
      </div>
      <div class="phone__screen" id="screen">
        <iframe id="frame" src="/" title="Adjung Quick"></iframe>
      </div>
    </div>
    <div class="device-label" id="deviceLabel"></div>

    <script>
      const DEVICES = [
        { name: 'iPhone 11', w: 375, h: 812 },
        { name: 'iPhone 12/13', w: 390, h: 844 },
        { name: 'Android standard', w: 360, h: 800 },
      ];

      const controls = document.getElementById('controls');
      const phone = document.getElementById('phone');
      const screen = document.getElementById('screen');
      const frame = document.getElementById('frame');
      const deviceLabel = document.getElementById('deviceLabel');

      function applyDevice(device) {
        const bezel = 14; // matches .phone padding
        phone.style.width = (device.w + bezel * 2) + 'px';
        phone.style.height = (device.h + bezel * 2) + 'px';
        screen.style.width = device.w + 'px';
        screen.style.height = device.h + 'px';
        deviceLabel.textContent = device.name + ' — ' + device.w + '×' + device.h;
        [...controls.children].forEach(b => b.classList.toggle('active', b.textContent.startsWith(device.name)));
        // Reload the iframe so the app's own resize/mount logic runs fresh
        // at the new viewport size (matches a real device launch).
        frame.src = frame.src;
      }

      DEVICES.forEach((device, i) => {
        const btn = document.createElement('button');
        btn.textContent = device.name + ' (' + device.w + '×' + device.h + ')';
        btn.onclick = () => applyDevice(device);
        controls.appendChild(btn);
      });

      applyDevice(DEVICES[0]);

      // Live clock in the fake status bar — purely cosmetic.
      setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent =
          d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
      }, 10000);
    </script>
  </body>
</html>
